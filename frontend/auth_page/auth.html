<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">PrivCloud - Sign In</title>
    <!-- Importing Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://qrxjyvezlotjwggtgoqe.supabase.co/storage/v1/object/public/assets/logo.png">
    <!-- Auth Styles -->
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="../landing_page/chatbot/chatbot.css?v=20">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/supabaseClient.js?v=21"></script>
</head>

<body class="auth-body">

    <!-- Top Navigation Bar (Identical to Landing Page) -->
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <img src="https://qrxjyvezlotjwggtgoqe.supabase.co/storage/v1/object/public/assets/logo.png" alt="PrivCloud Logo" class="nav-logo">
            <span class="nav-brand-text">PrivCloud</span>
        </a>
        <ul class="nav-links">
            <li><a href="../index.html#a8f10e7b9c2d4a6e">Overview</a></li>
            <li><a href="../index.html#3b8c2f1e4a7d90bc">Features</a></li>
            <li><a href="../index.html#7e2a9b4c0f81d3ea">About Us</a></li>
            <li><a href="../product_page/product.html">Product</a></li>
        </ul>
        <div class="nav-actions">
            <a href="#e9b4c0f81d3ea72a" class="btn-login" onclick="switchAuthMode('login'); return false;">Login</a>
            <a href="#f2d8a0c4e6b1973f" class="btn-register" onclick="switchAuthMode('register'); return false;">Register</a>
        </div>
    </nav>

    <main class="auth-page-wrapper">
        <div class="auth-container">

            <!-- Glassmorphic Auth Card -->
            <div class="auth-card">
                
                <!-- Branding Header -->
                <div class="auth-brand-section">
                    <div class="auth-logo-container">
                        <img src="https://qrxjyvezlotjwggtgoqe.supabase.co/storage/v1/object/public/assets/logo.png" alt="PrivCloud Logo" class="auth-logo-img">
                    </div>
                    <h1 class="auth-brand-title">PrivCloud</h1>
                    <p class="auth-brand-subtitle" id="auth-subtitle">Welcome back! Sign in to access your cloud storage.</p>
                </div>

                <!-- Segmented Tab Switcher -->
                <div class="auth-tab-group" id="auth-tab-group" role="tablist" aria-label="Authentication Options">
                    <button type="button" id="tab-login" class="auth-tab active" role="tab" aria-selected="true" onclick="switchAuthMode('login')">
                        Sign In
                    </button>
                    <button type="button" id="tab-register" class="auth-tab" role="tab" aria-selected="false" onclick="switchAuthMode('register')">
                        Create Account
                    </button>
                </div>

                <!-- Inline Alert Banner (Visible for both Main and OTP forms) -->
                <div id="auth-alert" class="auth-alert hidden" role="alert">
                    <svg class="alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="auth-alert-text">Only major email providers are allowed.</span>
                </div>

                <!-- Unified Login / Register Form -->
                <form id="auth-form" class="auth-form" onsubmit="handleAuthSubmit(event)">

                    <!-- Username Field (Create Account mode only) -->
                    <div class="form-group hidden" id="group-username">
                        <label for="auth-username">Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input type="text" id="auth-username" name="custom_username" placeholder="e.g. alex24" autocomplete="username" oninput="clearAuthAlert()">
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div class="form-group" id="group-email">
                        <label for="auth-email" id="label-email">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>
                            <input type="text" id="auth-email" name="email" placeholder="e.g. alex@gmail.com" required autocomplete="email" oninput="clearAuthAlert()">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group" id="group-password">
                        <label for="auth-password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input type="password" id="auth-password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('auth-password', this)" aria-label="Toggle password visibility" title="Show password">
                                <svg class="eye-open" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-closed hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="form-helper-row" id="forgot-wrapper">
                            <a href="#forgot" id="forgot-link" class="form-link-subtle" onclick="handleForgotPassword(); return false;">Forgot Password?</a>
                        </div>
                    </div>

                    <!-- Confirm Password Field (Create Account mode only) -->
                    <div class="form-group hidden" id="group-confirm-password">
                        <label for="auth-confirm-password">Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                </svg>
                            </span>
                            <input type="password" id="auth-confirm-password" name="confirm_password" placeholder="Re-enter your password" autocomplete="new-password">
                            <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('auth-confirm-password', this)" aria-label="Toggle password visibility" title="Show password">
                                <svg class="eye-open" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-closed hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Dynamic Submit Button -->
                    <button type="submit" id="auth-submit-btn" class="auth-submit-btn">
                        <span id="submit-btn-text">Sign In to PrivCloud</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>

                <!-- 6-Box OTP Verification UI (Replaces Create Account form) -->
                <div id="otp-view" class="auth-form hidden">
                    <div class="otp-info-card">
                        <span>Enter the 6-digit verification code sent to</span><br>
                        <span class="otp-email-highlight" id="otp-target-email">your email</span>
                    </div>

                    <form id="otp-form" onsubmit="handleOtpVerify(event)">
                        <div class="otp-boxes-container" id="otp-boxes">
                            <input type="text" class="otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" data-index="0">
                            <input type="text" class="otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" data-index="1">
                            <input type="text" class="otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" data-index="2">
                            <input type="text" class="otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" data-index="3">
                            <input type="text" class="otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" data-index="4">
                            <input type="text" class="otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" data-index="5">
                        </div>

                        <div class="otp-actions-row">
                            <button type="button" class="form-link-subtle" style="background: none; border: none; cursor: pointer; padding: 0;" onclick="backToRegisterForm()">
                                ← Change Email
                            </button>
                            <button type="button" id="btn-resend-otp" class="btn-resend-otp" onclick="handleResendOtp()">
                                Resend Code
                            </button>
                        </div>

                        <button type="submit" id="otp-verify-btn" class="auth-submit-btn">
                            <span id="otp-verify-text">Verify & Create Account</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </form>
                </div>

                <!-- Footer Mode Switch Link -->
                <div class="auth-footer-text" id="auth-footer-text">
                    Don't have an account? <a href="#f2d8a0c4e6b1973f" onclick="switchAuthMode('register'); return false;">Create one now</a>
                </div>

            </div>
        </div>
    <!-- Authentication Logic Script -->
    <script src="auth.js"></script>
    <script src="../landing_page/chatbot/chatbot.js?v=20"></script>
</body>

</html>
