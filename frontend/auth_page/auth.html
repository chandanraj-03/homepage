    <!-- Dynamic Mode Switching & Validation Script -->
    <script>
        let currentMode = 'login';
        let registeredEmail = '';
        let resendTimerInterval = null;

        // Strict Allowlist: Major standard providers only
        const ALLOWED_EMAIL_DOMAINS = [
            'gmail.com', 'googlemail.com',
            'outlook.com', 'hotmail.com', 'live.com', 'msn.com',
            'yahoo.com', 'yahoo.co.in', 'ymail.com',
            'proton.me', 'protonmail.com',
            'icloud.com', 'me.com', 'mac.com',
            'zoho.com',
            'aol.com',
            'gmx.com', 'mail.com'
        ];

        function showAuthAlert(message, isSuccess = false) {
            const alertBox = document.getElementById('auth-alert');
            const alertText = document.getElementById('auth-alert-text');
            const usernameInput = document.getElementById('auth-username');
            
            alertText.textContent = message;
            if (isSuccess) {
                alertBox.classList.add('success');
            } else {
                alertBox.classList.remove('success');
                if (usernameInput) {
                    usernameInput.classList.add('input-error');
                    usernameInput.focus();
                }
            }
            alertBox.classList.remove('hidden');
        }

        function clearAuthAlert() {
            const alertBox = document.getElementById('auth-alert');
            const usernameInput = document.getElementById('auth-username');
            alertBox.classList.add('hidden');
            alertBox.classList.remove('success');
            if (usernameInput) usernameInput.classList.remove('input-error');
        }

        function validateEmailProvider(val) {
            const trimmed = val.trim().toLowerCase();
            
            if (trimmed.includes('@')) {
                const parts = trimmed.split('@');
                const domain = parts[parts.length - 1];
                
                if (!ALLOWED_EMAIL_DOMAINS.includes(domain)) {
                    return {
                        valid: false,
                        message: 'Only major providers are allowed (Gmail, Outlook, Yahoo, Proton, iCloud, Zoho).'
                    };
                }
            } else {
                return {
                    valid: false,
                    message: 'Please enter a valid email address (e.g. alex@gmail.com).'
                };
            }
            return { valid: true };
        }

        // Strong Password Validator (Min 8 chars, uppercase, lowercase, digit, special char)
        function validateStrongPassword(pass) {
            if (!pass || pass.length < 8) {
                return {
                    valid: false,
                    message: 'Password must be at least 8 characters long.'
                };
            }
            if (!/[A-Z]/.test(pass)) {
                return {
                    valid: false,
                    message: 'Password must include at least one uppercase letter (A-Z).'
                };
            }
            if (!/[a-z]/.test(pass)) {
                return {
                    valid: false,
                    message: 'Password must include at least one lowercase letter (a-z).'
                };
            }
            if (!/[0-9]/.test(pass)) {
                return {
                    valid: false,
                    message: 'Password must include at least one number (0-9).'
                };
            }
            if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(pass)) {
                return {
                    valid: false,
                    message: 'Password must include at least one special character (!@#$%^&*).'
                };
            }
            return { valid: true };
        }

        function switchAuthMode(mode, updateHistory = true) {
            clearAuthAlert();
            hideOtpView();
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const pageTitle = document.getElementById('page-title');
            const subtitle = document.getElementById('auth-subtitle');
            const forgotWrapper = document.getElementById('forgot-wrapper');
            const submitBtnText = document.getElementById('submit-btn-text');
            const footerText = document.getElementById('auth-footer-text');
            const groupUsername = document.getElementById('group-username');
            const groupConfirmPassword = document.getElementById('group-confirm-password');
            const passwordInput = document.getElementById('auth-password');

            if (mode === 'register') {
                tabLogin.classList.remove('active');
                tabLogin.setAttribute('aria-selected', 'false');
                tabRegister.classList.add('active');
                tabRegister.setAttribute('aria-selected', 'true');

                pageTitle.textContent = "PrivCloud - Create Account";
                subtitle.textContent = "Create your personal cloud account to get started.";
                if (groupUsername) groupUsername.classList.remove('hidden');
                if (groupConfirmPassword) groupConfirmPassword.classList.remove('hidden');
                if (forgotWrapper) forgotWrapper.style.display = 'none';
                if (passwordInput) passwordInput.placeholder = "Create password (min. 8 chars, A-Z, 0-9, symbol)";
                submitBtnText.textContent = "Create Account";
                footerText.innerHTML = 'Already have an account? <a href="#login" onclick="switchAuthMode(\'login\'); return false;">Sign in</a>';
                
                if (updateHistory && window.location.hash !== '#register') {
                    history.replaceState(null, null, '#register');
                }
            } else {
                tabRegister.classList.remove('active');
                tabRegister.setAttribute('aria-selected', 'false');
                tabLogin.classList.add('active');
                tabLogin.setAttribute('aria-selected', 'true');

                pageTitle.textContent = "PrivCloud - Sign In";
                subtitle.textContent = "Welcome back! Sign in to access your cloud storage.";
                if (groupUsername) groupUsername.classList.add('hidden');
                if (groupConfirmPassword) groupConfirmPassword.classList.add('hidden');
                if (forgotWrapper) forgotWrapper.style.display = 'flex';
                if (passwordInput) passwordInput.placeholder = "Enter your password";
                submitBtnText.textContent = "Sign In to PrivCloud";
                footerText.innerHTML = 'Don\'t have an account? <a href="#register" onclick="switchAuthMode(\'register\'); return false;">Create one now</a>';
                
                if (updateHistory && window.location.hash !== '#login' && window.location.hash !== '') {
                    history.replaceState(null, null, '#login');
                }
            }
        }

        // =========================================================
        // 6-BOX OTP UI CONTROLS & AUTO-NAVIGATION
        // =========================================================

        function showOtpView(email) {
            registeredEmail = email;
            clearAuthAlert();

            const tabGroup = document.getElementById('auth-tab-group');
            const authForm = document.getElementById('auth-form');
            const otpView = document.getElementById('otp-view');
            const targetEmailSpan = document.getElementById('otp-target-email');
            const footerText = document.getElementById('auth-footer-text');
            const subtitle = document.getElementById('auth-subtitle');
            const pageTitle = document.getElementById('page-title');

            if (tabGroup) tabGroup.style.display = 'none';
            if (authForm) {
                authForm.classList.add('hidden');
                authForm.style.display = 'none';
            }
            if (otpView) {
                otpView.classList.remove('hidden');
                otpView.style.display = 'block';
            }
            if (footerText) footerText.style.display = 'none';

            pageTitle.textContent = "PrivCloud - Verify Code";
            subtitle.textContent = "Enter your 6-digit verification code.";
            targetEmailSpan.textContent = email;

            // Clear digit boxes & focus first
            const boxes = document.querySelectorAll('.otp-digit-box');
            boxes.forEach(box => {
                box.value = '';
                box.classList.remove('filled');
            });
            if (boxes[0]) boxes[0].focus();

            startResendCountdown(45);
        }

        function hideOtpView() {
            if (resendTimerInterval) clearInterval(resendTimerInterval);

            const tabGroup = document.getElementById('auth-tab-group');
            const authForm = document.getElementById('auth-form');
            const otpView = document.getElementById('otp-view');
            const footerText = document.getElementById('auth-footer-text');

            if (tabGroup) tabGroup.style.display = 'flex';
            if (authForm) {
                authForm.classList.remove('hidden');
                authForm.style.display = 'block';
            }
            if (otpView) {
                otpView.classList.add('hidden');
                otpView.style.display = 'none';
            }
            if (footerText) footerText.style.display = 'block';
        }

        function backToRegisterForm() {
            hideOtpView();
            switchAuthMode('register');
        }

        function setupOtpBoxListeners() {
            const boxes = document.querySelectorAll('.otp-digit-box');

            boxes.forEach((box, idx) => {
                box.addEventListener('input', (e) => {
                    clearAuthAlert();
                    boxes.forEach(b => b.classList.remove('input-error'));
                    const val = e.target.value.replace(/[^0-9]/g, '');
                    e.target.value = val ? val.slice(-1) : '';

                    if (e.target.value) {
                        e.target.classList.add('filled');
                        if (idx < boxes.length - 1) {
                            boxes[idx + 1].focus();
                        }
                    } else {
                        e.target.classList.remove('filled');
                    }
                });

                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                        boxes[idx - 1].focus();
                        boxes[idx - 1].value = '';
                        boxes[idx - 1].classList.remove('filled');
                    }
                });

                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim().replace(/[^0-9]/g, '');
                    if (pasteData.length > 0) {
                        const digits = pasteData.slice(0, 6).split('');
                        digits.forEach((digit, i) => {
                            if (boxes[i]) {
                                boxes[i].value = digit;
                                boxes[i].classList.add('filled');
                            }
                        });
                        const nextIndex = Math.min(digits.length, boxes.length - 1);
                        boxes[nextIndex].focus();
                    }
                });
            });
        }

        function startResendCountdown(seconds) {
            const btnResend = document.getElementById('btn-resend-otp');
            if (!btnResend) return;

            if (resendTimerInterval) clearInterval(resendTimerInterval);

            let remaining = seconds;
            btnResend.disabled = true;
            btnResend.textContent = `Resend in ${remaining}s`;

            resendTimerInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(resendTimerInterval);
                    btnResend.disabled = false;
                    btnResend.textContent = "Resend Code";
                } else {
                    btnResend.textContent = `Resend in ${remaining}s`;
                }
            }, 1000);
        }

        async function handleResendOtp() {
            if (!registeredEmail) return;
            clearAuthAlert();

            try {
                const { error } = await PrivCloudAuth.resendOtp(registeredEmail, 'signup');
                if (error) {
                    showAuthAlert(error.message);
                } else {
                    showAuthAlert("A new 6-digit code has been sent!", true);
                    startResendCountdown(60);
                }
            } catch (err) {
                showAuthAlert(err.message || "Failed to resend code.");
            }
        }

        async function handleOtpVerify(e) {
            e.preventDefault();
            clearAuthAlert();

            const boxes = document.querySelectorAll('.otp-digit-box');
            let otpCode = '';
            boxes.forEach(box => otpCode += box.value.trim());

            if (otpCode.length !== 6) {
                showAuthAlert("Please enter all 6 digits of the verification code.");
                boxes.forEach(box => box.classList.add('input-error'));
                if (boxes[0]) boxes[0].focus();
                return;
            }

            const btn = document.getElementById('otp-verify-btn');
            const btnText = document.getElementById('otp-verify-text');
            const originalText = btnText.textContent;

            btnText.textContent = "Verifying Code...";
            btn.disabled = true;

            try {
                const { data, error } = await PrivCloudAuth.verifyOtp(registeredEmail, otpCode, 'signup');
                if (error) {
                    showAuthAlert(error.message || "Invalid or expired verification code. Please try again.");
                    boxes.forEach(box => {
                        box.classList.add('input-error');
                        box.value = '';
                        box.classList.remove('filled');
                    });
                    if (boxes[0]) boxes[0].focus();
                    btn.disabled = false;
                    btnText.textContent = originalText;
                } else {
                    showAuthAlert("Code verified! Redirecting...", true);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
            } catch (err) {
                showAuthAlert(err.message || "Verification failed. Please try again.");
                boxes.forEach(box => {
                    box.classList.add('input-error');
                    box.value = '';
                    box.classList.remove('filled');
                });
                if (boxes[0]) boxes[0].focus();
                btn.disabled = false;
                btnText.textContent = originalText;
            }
        }

        // Initialize state on page load and handle browser back/forward
        function handleHashRouting() {
            const hash = window.location.hash.toLowerCase();
            if (hash === '#register') {
                switchAuthMode('register', false);
            } else {
                switchAuthMode('login', false);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            handleHashRouting();
            setupOtpBoxListeners();
        });
        window.addEventListener('hashchange', handleHashRouting);
        window.addEventListener('popstate', handleHashRouting);

        // Password Show/Hide Toggle
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const eyeOpen = btn.querySelector('.eye-open');
            const eyeClosed = btn.querySelector('.eye-closed');

            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
                btn.setAttribute('title', 'Hide password');
            } else {
                input.type = 'password';
                eyeClosed.classList.add('hidden');
                eyeOpen.classList.remove('hidden');
                btn.setAttribute('title', 'Show password');
            }
        }

        // Handle Forgot Password
        async function handleForgotPassword() {
            clearAuthAlert();
            const emailInput = document.getElementById('auth-email');
            const email = emailInput ? emailInput.value.trim() : '';

            if (!email) {
                showAuthAlert("Please enter your email address to receive password reset instructions.");
                if (emailInput) emailInput.focus();
                return;
            }

            const validation = validateEmailProvider(email);
            if (!validation.valid) {
                showAuthAlert(validation.message);
                return;
            }

            try {
                const { error } = await PrivCloudAuth.resetPassword(email);
                if (error) {
                    showAuthAlert(error.message);
                } else {
                    showAuthAlert(`Password reset instructions sent to ${email}`, true);
                }
            } catch (err) {
                showAuthAlert(err.message || "Failed to send reset link.");
            }
        }

        // Form Submit with Supabase Auth
        async function handleAuthSubmit(e) {
            e.preventDefault();
            clearAuthAlert();

            const emailInput = document.getElementById('auth-email');
            const email = emailInput ? emailInput.value.trim() : '';
            const passwordInput = document.getElementById('auth-password');
            const password = passwordInput ? passwordInput.value : '';

            // Register mode
            if (currentMode === 'register') {
                const usernameInput = document.getElementById('auth-username');
                const username = usernameInput ? usernameInput.value.trim() : '';
                const confirmPasswordInput = document.getElementById('auth-confirm-password');
                const confirmPassword = confirmPasswordInput ? confirmPasswordInput.value : '';

                if (!username || username.length < 3) {
                    showAuthAlert("Please enter a valid username (at least 3 characters).");
                    if (usernameInput) usernameInput.focus();
                    return;
                }

                const validation = validateEmailProvider(email);
                if (!validation.valid) {
                    showAuthAlert(validation.message);
                    if (emailInput) emailInput.focus();
                    return;
                }

                const passValidation = validateStrongPassword(password);
                if (!passValidation.valid) {
                    showAuthAlert(passValidation.message);
                    if (passwordInput) passwordInput.focus();
                    return;
                }

                if (password !== confirmPassword) {
                    showAuthAlert("Passwords do not match. Please re-enter.");
                    if (confirmPasswordInput) confirmPasswordInput.focus();
                    return;
                }

                const btn = document.getElementById('auth-submit-btn');
                const submitText = document.getElementById('submit-btn-text');
                const originalText = submitText.textContent;

                submitText.textContent = "Creating Account...";
                btn.disabled = true;

                try {
                    const res = await PrivCloudAuth.signUp(email, password, {
                        username: username,
                        email: email
                    });
                    if (res && res.error) {
                        showAuthAlert(res.error.message);
                        btn.disabled = false;
                        submitText.textContent = originalText;
                        return;
                    }
                } catch (err) {
                    if (err && err.message) {
                        showAuthAlert(err.message);
                        btn.disabled = false;
                        submitText.textContent = originalText;
                        return;
                    }
                }

                btn.disabled = false;
                submitText.textContent = originalText;
                // Replace Create Account form with the 6-Box OTP Verification UI
                showOtpView(email);
                return;
            }

            // Sign In mode
            const validation = validateEmailProvider(email);
            if (!validation.valid) {
                showAuthAlert(validation.message);
                if (emailInput) emailInput.focus();
                return;
            }

            if (!password || password.length < 6) {
                showAuthAlert("Password must be at least 6 characters.");
                if (passwordInput) passwordInput.focus();
                return;
            }

            const btn = document.getElementById('auth-submit-btn');
            const submitText = document.getElementById('submit-btn-text');
            const originalText = submitText.textContent;

            submitText.textContent = "Signing In...";
            btn.disabled = true;
            btn.style.opacity = '0.8';

            try {
                const { data, error } = await PrivCloudAuth.signIn(email, password);
                if (error) {
                    showAuthAlert(error.message);
                } else {
                    showAuthAlert("Signed in successfully! Redirecting...", true);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
            } catch (err) {
                showAuthAlert(err.message || "An unexpected error occurred.");
            } finally {
                submitText.textContent = originalText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
