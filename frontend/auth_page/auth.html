<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">PrivCloud - Sign In</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://qrxjyvezlotjwggtgoqe.supabase.co/storage/v1/object/public/assets/logo.png">
    
    <!-- Auth Styles -->
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="../landing_page/chatbot/chatbot.css?v=20">

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabaseClient.js"></script>
</head>

<body class="auth-body">

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <a href="../index.html" class="nav-brand">
            <img src="https://qrxjyvezlotjwggtgoqe.supabase.co/storage/v1/object/public/assets/logo.png" alt="PrivCloud Logo" class="nav-logo">
            <span class="nav-brand-text">PrivCloud</span>
        </a>
        <ul class="nav-links">
            <li><a href="../index.html#a8f10e7b9c2d4a6e">Overview</a></li>
            <li><a href="../index.html#3b8c2f1e4a7d90bc">Features</a></li>
            <li><a href="../index.html#7e2a9b4c0f81d3ea">About Us</a></li>
            <li><a href="../product_page/product.html">Product</a></li>
        </ul>
        <div class="nav-actions">
            <a href="#e9b4c0f81d3ea72a" class="btn-login" onclick="switchAuthMode('login'); return false;">Login</a>
            <a href="#f2d8a0c4e6b1973f" class="btn-register" onclick="switchAuthMode('register'); return false;">Register</a>
        </div>
    </nav>

    <main class="auth-page-wrapper">
        <div class="auth-container">

            <!-- Glassmorphic Auth Card -->
            <div class="auth-card">
                
                <!-- Branding Header -->
                <div class="auth-brand-section">
                    <div class="auth-logo-container">
                        <img src="https://qrxjyvezlotjwggtgoqe.supabase.co/storage/v1/object/public/assets/logo.png" alt="PrivCloud Logo" class="auth-logo-img">
                    </div>
                    <h1 class="auth-brand-title">PrivCloud</h1>
                    <p class="auth-brand-subtitle" id="auth-subtitle">Welcome back! Sign in to access your cloud storage.</p>
                </div>

                <!-- Segmented Tab Switcher -->
                <div class="auth-tab-group" role="tablist" aria-label="Authentication Options">
                    <button type="button" id="tab-login" class="auth-tab active" role="tab" aria-selected="true" onclick="switchAuthMode('login')">
                        Sign In
                    </button>
                    <button type="button" id="tab-register" class="auth-tab" role="tab" aria-selected="false" onclick="switchAuthMode('register')">
                        Create Account
                    </button>
                </div>

                <!-- Unified Form -->
                <form id="auth-form" class="auth-form" onsubmit="handleAuthSubmit(event)">
                    
                    <!-- Inline Alert Banner -->
                    <div id="auth-alert" class="auth-alert hidden" role="alert">
                        <svg class="alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span id="auth-alert-text">Only major email providers are allowed.</span>
                    </div>

                    <div class="form-group">
                        <label for="auth-username" id="label-username">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input type="text" id="auth-username" name="username" placeholder="e.g. alex@gmail.com" required autocomplete="username" oninput="clearAuthAlert()">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="auth-password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input type="password" id="auth-password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('auth-password', this)" aria-label="Toggle password visibility" title="Show password">
                                <svg class="eye-open" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-closed hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                                    <line x1="2" y1="2" x2="22" y2="22"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="form-helper-row" id="forgot-wrapper">
                            <a href="javascript:void(0)" class="form-link-subtle" onclick="handleForgotPassword()">Forgot password?</a>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit-btn" id="auth-submit-btn">
                        <span id="submit-btn-text">Sign In to PrivCloud</span>
                    </button>
                </form>

                <div class="auth-footer-text" id="auth-footer-text">
                    Don't have an account? <a href="#f2d8a0c4e6b1973f" onclick="switchAuthMode('register'); return false;">Create one now</a>
                </div>

            </div>
        </div>
    </main>

    <!-- Authentication Logic Script -->
    <script src="auth.js"></script>
    <script src="../landing_page/chatbot/chatbot.js?v=20"></script>
</body>

</html>
